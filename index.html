<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MyLibrary</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <h1>MyLibrary</h1>
    <p class="intro">A home for the books I want to remember.</p>

    <form id="book-form">
        <div class="isbn-section">
              <label for="isbn">ISBN</label>

              <div class="isbn-controls">
                <input
                  id="isbn"
                  type="text"
                  inputmode="numeric"
                  placeholder="978..."
                >

                <button id="lookup-button" type="button">
                  Find Book
                </button>
              </div>

                      <button id="scan-button" type="button">
          Scan Barcode
        </button>

        <div id="scanner-container" hidden>
          <div id="barcode-reader"></div>

          <button id="stop-scan-button" type="button">
            Stop Camera
          </button>
        </div>

          <p id="lookup-message" aria-live="polite"></p>

        </div>

      <label for="title">Book title</label>
      <input
        id="title"
        type="text"
        placeholder="Braiding Sweetgrass"
        required
      >

      <label for="author">Author</label>
      <input
        id="author"
        type="text"
        placeholder="Robin Wall Kimmerer"
        required
      >

            <label for="pages">Number of pages</label>
      <input
        id="pages"
        type="number"
        min="1"
        placeholder="408"
      >

      <label for="publish-date">Publication date</label>
      <input
        id="publish-date"
        type="text"
        placeholder="2013"
      >

      <input id="cover-url" type="hidden">

      <label for="cover-upload">Your cover image</label>
      <input
        id="cover-upload"
        type="file"
        accept="image/*"
        capture="environment"
      >
      <p class="field-help">
        Take a photo of your copy or choose an image from your device.
      </p>

      <div id="cover-preview-container" hidden>
        <p><strong>Book cover</strong></p>
        <img id="cover-preview" alt="Book cover preview">
      </div>

      <label for="status">Reading status</label>
      <select id="status">
        <option value="Want to Read">Want to Read</option>
        <option value="Reading">Reading</option>
        <option value="Finished">Finished</option>
      </select>

      <button type="submit">Add Book</button>
    </form>

    <section>
      <h2>My Books</h2>
      <div id="book-list"></div>
    </section>
  </main>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
